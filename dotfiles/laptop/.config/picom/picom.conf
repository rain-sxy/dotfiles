backend = "glx";

vsync = true;

blur-background = true;
blur-background-exclude = [
	"window_type = 'dock'",
	"class_g = 'slop'"
];

blur-method = "dual_kawase"
blur-strength = 6;

active-opacity = 1;
inactive-opacity = 1;
frame-opacity = 1;

opacity-rule = [
	"80:class_g = 'kitty' && focused",
	"80:class_g = 'kitty' && !focused"
];

shadow = true;
shadow-radius = 12;
shadow-offset-x = -10;
shadow-offset-y = -10;
