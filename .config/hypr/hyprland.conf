################
### MONITORS ###
################
ecosystem:no_update_news = true

monitor=DP-1,1920x1080@60.00,1920x0,1,vrr,1

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$menu = rofi -show drun
$switchWallpaper = ~/.config/hypr/wallpaper/switchwallpaper.sh 
$browser = zen-browser
$spotify = feishin
$discord = vesktop
$steam = steam
$lock = hyprlock
$navidrome = sudo navidrome -c /etc/navidrome/navidrome.toml

#################
### AUTOSTART ###
#################

exec-once = awww-daemon

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false, blur
        size = 1
        passes = 5

        vibrancy = 0.1696
    }
}
animations {
    enabled = false, animations
        bezier = winIn, 0.1, 1.0, 0.1, 1.0
        bezier = winOut, 0.1, 1.0, 0.1, 1.0
        bezier = smoothOut, 0.5, 0, 0.99, 0.99
        bezier = layerOut,0.23,1,0.32,1
        animation = windowsIn, 1, 7, winIn, slide
        animation = windowsOut, 1, 3, smoothOut, slide
        animation = windowsMove, 1, 7, winIn, slide
        animation = workspacesIn, 1, 8, winIn, slide
        animation = workspacesOut, 1, 8, winOut, slide
        animation = layersIn, 1, 10, winIn, slide
        animation = layersOut, 1, 3, layerOut, popin 50%
}
